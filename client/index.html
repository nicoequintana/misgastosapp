<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tus Gastos - Control Personal</title>
    <meta name="description" content="Registrá gastos, analizá tus finanzas y tomá decisiones con claridad." />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Tus Gastos - Control Personal" />
    <meta property="og:description" content="Registrá gastos, analizá tus finanzas y tomá decisiones con claridad." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-192.svg" />
    <meta property="og:url" content="/" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tus Gastos - Control Personal" />
    <meta name="twitter:description" content="Registrá gastos, analizá tus finanzas y tomá decisiones con claridad." />
    <meta name="twitter:image" content="/icon-192.svg" />

    <!-- PWA: tema y color de barra de estado -->
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA: soporte iOS (Safari no usa el manifest para esto) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tus Gastos" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- Ícono principal -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Fuentes: self-hosted vía @fontsource (importadas en src/main.jsx).
         Evita depender de fonts.googleapis.com/gstatic.com en runtime — el Service
         Worker no puede cachear mal algo que ya está empaquetado en el propio build. -->
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
